version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bundler-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        exclude-patterns:
          - rails
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"
      rails:
        applies-to: version-updates
        patterns:
          - rails
    ignore:
      - dependency-name: rails
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
